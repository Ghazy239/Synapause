<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapause</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Poppins,sans-serif;
        }

        body{
            width:320px;
            background:#10151f;
            color:white;
            padding:22px;
        }

        h2{
            font-size:24px;
            margin-bottom:8px;
        }

        p{
            color:#9aa4b2;
            margin-bottom:18px;
        }

        button{
            width:100%;
            padding:14px;
            border:none;
            border-radius:12px;
            background:#6c5cff;
            color:white;
            cursor:pointer;
            font-size:15px;
        }

        button:hover{
            background:#5b4bff;
        }
    </style>
</head>
<body>
    <h2>Synapause</h2>
    <p id="status">Checking login...</p>
    <button id="dashboard">
        Open Dashboard
    </button>
<script src="popup.js"></script>
</body>
</html>
